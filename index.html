<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Tumor Detection</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/robot.png">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e2d;
            color: #f5f5f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            color: #ecf0f1;
            font-size: 28px;
            text-align: center;
        }

        p {
            text-align: center;
            color: #bdc3c7;
        }

        .container {
            background-color: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        input[type="file"] {
            padding: 10px;
            margin: 20px 0;
            width: calc(100% - 20px); /* Adjust for padding */
            border-radius: 5px;
            border: 1px solid #7f8c8d;
            background-color: #34495e;
            color: #ecf0f1;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            background-color: #2980b9;
        }

        #preview {
            margin: 20px 0;
            max-width: 100%;
            max-height: 300px;
            display: none;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .image-preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #result {
            font-size: 18px;
            margin-top: 20px;
            padding: 10px;
            background-color: #34495e;
            border-radius: 5px;
            color: #f5f5f5;
            transition: background-color 0.3s ease-in-out;
            display: none; /* Initially hidden */
        }

        .positive {
            color: #ff4d4d;
        }
        
        .negative {
            color: #2ecc71;
        }

        .loading {
            color: #f39c12;
        }

        .error {
            color: #e74c3c;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #888;
        }

        footer a {
            color: #3498db;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Mobile responsive styles */
        @media (max-width: 600px) {
            .container {
                width: 90%;
            }

            h2 {
                font-size: 24px;
            }

            button {
                font-size: 14px;
                padding: 8px 16px;
            }

            input[type="file"] {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Brain Tumor Detection</h2>
        <p>Please upload an MRI image to check if a tumor is detected.</p>

        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="fileInput" name="file" accept="image/*" required />
            <div class="image-preview-container">
                <img id="preview" src="" alt="Image Preview" />
            </div>
            <button type="submit">Submit</button>
        </form>

        <p id="result"></p> <!-- Result area for displaying message -->
    </div>

    <footer>
        <p>&copy; 2024 Jagadish Das | All rights reserved.</p>
        <p>Designed & Developed by Jagadish Das</p>
        <a href="mailto:jagadishdas.nitrkl@gmail.com">Contact Me</a>
    </footer>

    <script>
        // Image preview functionality
        document.getElementById('fileInput').addEventListener('change', function (event) {
            var file = event.target.files[0];
            var preview = document.getElementById('preview');
    
            if (file) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        });
    
        // Form submission logic
        document.getElementById('uploadForm').addEventListener('submit', function (event) {
            event.preventDefault();
    
            var formData = new FormData();
            var fileInput = document.getElementById('fileInput');
            var resultElement = document.getElementById('result');
    
            // Check if a file is selected
            if (!fileInput.files[0]) {
                resultElement.innerHTML = 'Please select an image file.';
                resultElement.classList.add('error');
                return;
            }
    
            formData.append('file', fileInput.files[0]);
    
            // Display a loading message while the prediction is being processed
            resultElement.classList.remove('positive', 'negative', 'error', 'loading');
            resultElement.style.display = 'block'; // Show result area
            resultElement.innerHTML = 'Processing...';
            resultElement.classList.add('loading');
    
            fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Remove loading class and display the appropriate result
                    resultElement.classList.remove('loading');
                    if (data.prediction === 1) {
                        resultElement.innerHTML = 'Tumor Detected (Positive)';
                        resultElement.classList.add('positive');
                    } else if (data.prediction === 0) {
                        resultElement.innerHTML = 'No Tumor Detected (Negative)';
                        resultElement.classList.add('negative');
                    } else {
                        throw new Error('Unexpected response format');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    resultElement.innerHTML = 'An error occurred. Please try again.';
                    resultElement.classList.add('error');
                    resultElement.classList.remove('loading');
                });
        });
    </script>    

</body>
</html>
